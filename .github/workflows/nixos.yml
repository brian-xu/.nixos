name: NixOS

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/flake.yml'

jobs:
  build:
    if: "${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, 'update_flake_lock_action')) }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v2.3.2

      - name: "Free disk space for Nix"
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'cleave' # holster, carve, cleave (default), rampage

      - name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31.8.4
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes ca-derivations
            trusted-users = root runner

      - name: "Install Cachix ❄️"
        uses: cachix/cachix-action@v16
        with:
          name: brian-xu
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # Needed because cachix is also installed by Home Manager
      - name: "Set priority flag for Cachix 🚩"
        run: nix-env --set-flag priority 0 cachix

      - name: "Build NixOS config ❄️"
        run: |
          nix build .#nixosConfigurations.framework.config.system.build.toplevel -L

      # cachix-action's daemon-mode push silently loses uploads ("Push job
      # finished in 0s" for large NARs, then "Nothing to push" from later
      # steps consulting the same daemon's bookkeeping) while the cache 404s
      # the exact paths it claims to hold. Bypass the daemon: push
      # synchronously, verbosely, and verify a just-built narinfo afterward.
      - name: "Push closure to Cachix"
        env:
          CACHIX_DAEMON_DIR: ""
        run: |
          nix build .#nixosConfigurations.framework.config.system.build.toplevel -o result
          cachix push brian-xu result -v
          h=$(basename "$(readlink -f result)" | sed 's/-.*//')
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://brian-xu.cachix.org/$h.narinfo")
          echo "toplevel narinfo probe: $code"
          [ "$code" = "200" ] || { echo "CACHE PUSH FAILED: cache still lacks the toplevel" >&2; exit 1; }
