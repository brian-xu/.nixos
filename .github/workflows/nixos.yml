name: NixOS

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/flake.yml'
      - 'secrets/'

jobs:
  build:
    if: "${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, 'update_flake_lock_action')) }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        system: [framework]

    steps:
      - uses: actions/checkout@v2.3.2

      - name: "Free disk space for Nix"
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'cleave' # holster, carve, cleave (default), rampage

      - name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31.8.4
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes ca-derivations
            trusted-users = root runner

      - name: "Install Cachix ❄️"
        uses: cachix/cachix-action@v16
        with:
          name: brian-xu
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # Needed because cachix is also installed by Home Manager
      - name: "Set priority flag for Cachix 🚩"
        run: nix-env --set-flag priority 0 cachix

      - name: "Build NixOS config ❄️"
        run: |
          nix build .#nixosConfigurations.${{ matrix.system }}.config.system.build.toplevel -L

  ci-passed:
    name: CI Passed
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Gate on build result ❄️"
        run: |
          result="${{ needs.build.result }}"
          echo "build result: ${result}"
          # 'skipped' means the build job's if-guard excluded this event (lock auto-updates on push)
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            exit 1
          fi
